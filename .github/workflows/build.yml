name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Code
      run: unzip weatherai-pro.zip
      
    - name: Fix AI Studio Code
      run: |
        sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts
        cp .env.example .env
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build APK
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WeatherAI-App
        path: app/build/outputs/apk/debug/app-debug.apk
